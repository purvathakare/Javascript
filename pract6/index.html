<!DOCTYPE html>
<html>
<head>
    <title>String Functions and Regex</title>
</head>
<body>

    <h2>String Functions and Regular Expressions</h2>

    <textarea id="text"
        placeholder="Enter text, email or phone number"></textarea>

    <br><br>

    <button onclick="processText()">Process Text</button>

    <div id="result"></div>

    <script>
        function processText() {
            let text = document.getElementById("text").value;

            if (text.trim() === "") {
                alert("Please enter some text.");
                return;
            }

            let emailPattern =
                /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;

            let phonePattern = /\b\d{10}\b/g;

            let emails = text.match(emailPattern) || [];
            let phones = text.match(phonePattern) || [];

            let wordCount = text.trim().split(/\s+/).length;

            let jsCount = (text.match(/JavaScript/gi) || []).length;

            document.getElementById("result").innerHTML = `
                <p>Uppercase: ${text.toUpperCase()}</p>
                <p>Lowercase: ${text.toLowerCase()}</p>
                <p>Character Count: ${text.length}</p>
                <p>Word Count: ${wordCount}</p>
                <p>Emails: ${emails.join(", ") || "None"}</p>
                <p>Phone Numbers: ${phones.join(", ") || "None"}</p>
                <p>JavaScript Occurrences: ${jsCount}</p>
            `;
        }
    </script>

</body>
</html>
