<!DOCTYPE html>
<html>
<head>
    <title>Web Storage Demo</title>
</head>
<body>

    <h2>LocalStorage and SessionStorage</h2>

    <button onclick="setTheme('light')">Light Theme</button>
    <button onclick="setTheme('dark')">Dark Theme</button>
    <button onclick="clearTheme()">Remove Theme</button>

    <p id="status"></p>

    <script>
        function applyTheme(theme) {
            document.body.style.backgroundColor =
                theme === "dark" ? "#222" : "white";

            document.body.style.color =
                theme === "dark" ? "white" : "black";

            document.getElementById("status").textContent =
                "Current theme: " + theme;
        }

        function setTheme(theme) {
            // LocalStorage
            localStorage.setItem("theme", theme);

            // SessionStorage
            sessionStorage.setItem("lastTheme", theme);

            applyTheme(theme);
        }

        function clearTheme() {
            localStorage.removeItem("theme");
            sessionStorage.removeItem("lastTheme");

            applyTheme("light");

            document.getElementById("status").textContent =
                "Saved theme removed.";
        }

        let savedTheme =
            localStorage.getItem("theme") || "light";

        applyTheme(savedTheme);
    </script>

</body>
</html>
