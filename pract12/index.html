<!DOCTYPE html>
<html>
<head>
    <title>Interactive Task Manager</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>
</head>
<body>

    <h2>Interactive Task Manager</h2>

    <input type="text" id="task" placeholder="Enter Task">

    <button id="add">Add Task</button>

    <ul id="list"></ul>

    <hr>

    <h3>Load JSON Data Using AJAX</h3>

    <button id="load">Load Data</button>

    <ul id="data"></ul>

    <script>
        // Load saved tasks
        let tasks =
            JSON.parse(localStorage.getItem("tasks")) || [];

        // Save tasks
        function saveTasks() {
            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );
        }

        // Display tasks
        function displayTasks() {

            $("#list").empty();

            tasks.forEach(function(task, index) {

                let item = $("<li>");
                item.text(task + " ");

                let deleteButton = $("<button>")
                    .text("Delete")
                    .on("click", function() {

                        tasks.splice(index, 1);

                        saveTasks();
                        displayTasks();
                    });

                item.append(deleteButton);

                $("#list").append(item);
            });
        }

        // Add task
        $("#add").click(function() {

            let task = $("#task").val().trim();

            if (task !== "") {

                tasks.push(task);

                saveTasks();

                $("#task").val("");

                displayTasks();

            } else {
                alert("Enter a task.");
            }
        });

        // AJAX request
        $("#load").click(function() {

            $.ajax({

                url: "https://jsonplaceholder.typicode.com/posts?_limit=5",

                method: "GET",

                success: function(response) {

                    $("#data").empty();

                    response.forEach(function(post) {

                        $("#data").append(
                            $("<li>").text(post.title)
                        );
                    });
                },

                error: function() {
                    alert("Unable to load data.");
                }
            });
        });

        displayTasks();
    </script>

</body>
</html>
